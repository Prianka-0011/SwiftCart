<div class="p-6 bg-slate-50 min-h-screen">
  
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
      <h2 class="text-lg font-semibold text-slate-800">Order Management</h2>
      <div class="flex gap-3">
         <div class="relative">
            <mat-icon class="absolute left-2 top-2 text-slate-400 text-sm">search</mat-icon>
            <input type="text" placeholder="Search orders..." class="pl-9 pr-4 py-1.5 border border-slate-200 rounded-md text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
         </div>
         <button mat-stroked-button color="primary">Export</button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" matSort class="w-full">

        <ng-container matColumnDef="orderNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="!font-bold !text-slate-700 w-56"> Order ID </th>
          <td mat-cell *matCellDef="let order">
            <span class="font-mono text-indigo-600 font-medium cursor-pointer hover:underline" (click)="viewOrder(order.id)">
              #{{ order.orderNumber }}
            </span>
          </td>
        </ng-container>

        <!-- <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="!font-bold !text-slate-700"> Customer </th>
          <td mat-cell *matCellDef="let order">
            <div class="flex items-center gap-3 py-2">
              <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs font-bold border border-indigo-100">
                {{ (order.userId || '')[0] || '-' }}
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-medium text-slate-900 leading-none">User</span>
                <span class="text-xs text-slate-500 mt-0.5">ID: {{ order.userId }}</span>
              </div>
            </div>
          </td>
        </ng-container> -->

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="!font-bold !text-slate-700"> Date </th>
          <td mat-cell *matCellDef="let order" class="text-slate-500 text-sm">
            {{ order.createdAt | date:'MMM d, y' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="!font-bold !text-slate-700"> Total </th>
          <td mat-cell *matCellDef="let order" class="text-slate-900 font-medium">
            {{ order.totalAmount | currency }}
          </td>
        </ng-container>

        <ng-container matColumnDef="paymentStatus">
          <th mat-header-cell *matHeaderCellDef class="!font-bold !text-slate-700"> Payment </th>
          <td mat-cell *matCellDef="let order">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ring-1 ring-inset"
                  [ngClass]="getPaymentStyles(order.paymentStatus)">
              {{ order.paymentStatus }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="orderStatus">
          <th mat-header-cell *matHeaderCellDef class="!font-bold !text-slate-700"> Status </th>
          <td mat-cell *matCellDef="let order">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border"
                  [ngClass]="getOrderStatusStyles(order.orderStatus)">
              {{ order.orderStatus }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="w-10"></th>
          <td mat-cell *matCellDef="let order">
            <button mat-icon-button [matMenuTriggerFor]="menu" class="text-slate-400 hover:text-slate-600">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xPosition="before">
              <button mat-menu-item>
                <mat-icon class="text-slate-500">visibility</mat-icon> 
                <span>View Details</span>
              </button>
              <button mat-menu-item>
                <mat-icon class="text-slate-500">edit</mat-icon> 
                <span>Update Status</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-50/50 h-12"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewOrder(row.id)" class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0 cursor-pointer"></tr>

      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="border-t border-slate-200"></mat-paginator>

  </div>
</div>
