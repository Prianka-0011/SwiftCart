<div class="h-full flex flex-col bg-white border-r border-slate-200">
  
  <div class="h-16 flex items-center px-6 border-b border-slate-100">
    <div class="flex items-center gap-2 text-indigo-600">
      <mat-icon class="scale-110">admin_panel_settings</mat-icon>
      <span class="text-xl font-bold tracking-tight">AdminPro</span>
    </div>
  </div>

  <mat-nav-list class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    
    @for (item of menuItems(); track item.label) {
      <a mat-list-item 
         [routerLink]="item.route" 
         routerLinkActive="!bg-indigo-50 !text-indigo-600 rounded-lg"
         class="!rounded-lg mb-1 !text-slate-600 hover:!bg-slate-50 transition-colors">
        
        <mat-icon matListItemIcon class="!text-current opacity-70">{{ item.icon }}</mat-icon>
        <span matListItemTitle class="font-medium text-sm">{{ item.label }}</span>
      </a>
    }

  </mat-nav-list>

  <div class="p-4 border-t border-slate-100">
    <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors">
      <div class="w-10 h-10 rounded-full bg-indigo-200 flex items-center justify-center text-indigo-700 font-bold">
         {{ user?.username?.charAt(0)?.toUpperCase() ?? user?.email?.charAt(0)?.toUpperCase() }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs text-slate-500 truncate">{{user?.username}}</p>
        <p class="text-sm font-medium text-slate-900 truncate">{{ user?.email}}</p>
 
      </div>
    </div>
  </div>

</div>
