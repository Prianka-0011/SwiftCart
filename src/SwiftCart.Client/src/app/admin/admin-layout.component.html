<mat-sidenav-container class="h-screen bg-slate-50" autosize>

  <mat-sidenav 
    mode="side" 
    [opened]="isSidebarOpen()"
    class="w-64 border-r border-slate-200 shadow-sm bg-white"
    fixedInViewport="false">
    
    <app-sidebar [user]="user"></app-sidebar>

  </mat-sidenav>


  <mat-sidenav-content class="flex flex-col h-full overflow-hidden transition-all duration-300">

    <mat-toolbar class="bg-white border-b border-slate-200 !h-16 px-6 flex justify-between items-center z-10 sticky top-0">
      
      <div class="flex items-center gap-4">
        <button mat-icon-button (click)="toggleSidebar()" class="text-slate-600">
          <mat-icon>{{ isSidebarOpen() ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
        
        <h1 class="text-xl font-semibold text-slate-800">Dashboard</h1>
      </div>

      <div class="flex items-center gap-3">
        <button mat-icon-button class="text-slate-500">
          <mat-icon>search</mat-icon>
        </button>
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-xs">
          {{ user?.email?.charAt(0)?.toUpperCase() }}
        </div>
      </div>

    </mat-toolbar>

    <main class="flex-1 overflow-y-auto p-6">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
