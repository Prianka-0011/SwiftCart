<section class="max-w-5xl mx-auto py-12 px-4">
  <div class="mb-8 border-b pb-4 flex justify-between items-end">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Customer Reviews</h2>
      <p class="text-gray-500 text-sm">Real feedback from verified users</p>
    </div>
    <button
      class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors"
      (click)="onOpenDialog(true)"
    >
      Write a Review
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2   gap-6">
    @for (item of reviews(); track item.id) {
      <div class="bg-white border rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
         <h3 class="font-bold text-gray-900 mb-2">{{ item?.username }}</h3>
        <div class="flex items-center space-x-1 mb-2">
          @for (star of [1, 2, 3, 4, 5]; track star) {
            <svg 
              class="h-5 w-5" 
              [class.text-yellow-400]="star <= item.rating" 
              [class.text-gray-300]="star > item.rating"
              xmlns="http://www.w3.org/2000/svg" 
              viewBox="0 0 20 20" 
              fill="currentColor"
            >
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
          }
          <span class="ml-2 text-sm font-medium text-gray-500">{{ item.rating }}/5</span>
        </div>

       
        <p class="text-gray-600 text-sm font-medium mb-4 leading-relaxed line-clamp-3">
          {{ item?.comment }}
        </p>

       
      </div>
    } @empty {
      <div class="col-span-full py-12 text-center bg-gray-50 rounded-xl border-2 border-dashed">
        <p class="text-gray-500">No reviews available for this product yet.</p>
      </div>
    }
  </div>
</section>

<section>
  <app-review-modal
    [isOpen]="isOpen()"
    (closeDialog)="onOpenDialog(false)"
    (submitReview)="onSubmitReview($event)"
  ></app-review-modal>
</section>
