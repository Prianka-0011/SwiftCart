@if(this.isOpen()){
  
       <div class="fixed inset-0  bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-xs">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
        <button (click)="onCloseDialog()" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <h2 class="text-xl font-bold mb-4">Write a Review</h2>
       <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
        <div class="flex gap-2">
          <button type="button" *ngFor="let star of stars" (click)="setRating(star)"
            class="text-3xl transition-colors "
            [ngClass]="reviewForm.value.rating >= star ? 'text-yellow-400' : 'text-gray-900'"
            >
           ★
          </button>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Your Comment</label>
        <textarea formControlName="comment" rows="4" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
          placeholder="What did you like or dislike?"></textarea>
      </div>

      <div class="flex justify-end gap-3">
        <button type="button" (click)="onCloseDialog()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button type="submit" [disabled]="reviewForm.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
          Submit Review
        </button>
      </div>
    </form>
        </div>
    </div>
 
}
