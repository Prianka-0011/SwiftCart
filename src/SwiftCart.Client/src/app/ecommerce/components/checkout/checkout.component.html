<div class="flex mt-8 gap-6 container mx-auto p-4">
  <div class="w-full lg:w-3/4">
    <form [formGroup]="form">
      <mat-stepper (selectionChange)="onStepChange($event)" [linear]="true" #stepper class="shadow-sm border">
        
        <mat-step label="Shipping Address" [stepControl]="form">
          <div class="p-6">
            <div class="flex gap-4 mb-6">
                <div   class="grid grid-cols-1 gap-2">
                  <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Full Name</mat-label>
                    <input matInput formControlName="shipToName" />
                  </mat-form-field>
                  <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Street</mat-label>
                    <input matInput formControlName="street" />
                  </mat-form-field>
                  <div class="grid grid-cols-2 gap-4">
                    <mat-form-field appearance="outline"><mat-label>City</mat-label><input matInput formControlName="city" /></mat-form-field>
                    <mat-form-field appearance="outline"><mat-label>Zip Code</mat-label><input matInput formControlName="zipCode" /></mat-form-field>
                  </div>
                  <div class="grid grid-cols-2 gap-4">
                      <mat-form-field appearance="outline"><mat-label>State</mat-label><input matInput formControlName="state" /></mat-form-field>
                      <mat-form-field appearance="outline"><mat-label>Country</mat-label><input matInput formControlName="country" /></mat-form-field>
                  </div>
                </div>
          </div>
          </div>
          <div class="flex justify-end p-4 border-t">
            <button mat-flat-button color="primary" matStepperNext [disabled]="form.invalid">Next</button>
          </div>
        </mat-step>

        <mat-step label="Payment">
          <div class="p-6"><div id="payment-element" class="min-h-[200px]"></div></div>
          <div class="flex justify-between p-4 border-t">
            <button mat-stroked-button matStepperPrevious>Back</button>
            <button mat-flat-button color="primary" matStepperNext>Review</button>
          </div>
        </mat-step>

        <mat-step label="Review">
          <div class="p-6"><app-order-summary></app-order-summary>
            <div class="mt-8 flex gap-4">
              <button mat-stroked-button matStepperPrevious>Back</button>
              <button mat-flat-button color="accent" (click)="handlePayment()"  >
                Pay {{ cartService.totals()?.total | currency }}
              </button>
            </div>
          </div>
        </mat-step>
      </mat-stepper>
    </form>
  </div>
</div>
